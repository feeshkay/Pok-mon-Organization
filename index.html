<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kyle's Deck — Pokémon Collection & Binder</title>
<meta name="description" content="Collection, taxonomy, and physical binder tracker for Kyle's Pokémon card deck.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#132920;
  --ink-soft:#3f5a4d;
  --paper:#e9e6da;
  --paper-raised:#f5f3ea;
  --paper-sunken:#dbdccb;
  --line:#c2c9ab;
  --line-strong:#93a184;
  --brass:#a9822f;
  --brass-soft:#cba658;
  --crimson:#a23b3b;
  --crimson-soft:#c96a5c;
  --moss:#4f8a5b;
  --sky:#4d6f8a;
  --shadow:0 1px 2px rgba(15,42,31,.10), 0 4px 12px rgba(15,42,31,.08);
  --shadow-lg:0 8px 24px rgba(15,42,31,.18), 0 2px 6px rgba(15,42,31,.10);
  --radius:10px;
  --radius-sm:6px;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'Space Grotesk',monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  font-weight:600;
  margin:0;
  letter-spacing:-.01em;
}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--brass-soft);color:var(--ink);}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
.shell{display:flex;flex:1;min-height:0;}

.sidebar{
  width:220px;flex-shrink:0;background:var(--ink);color:var(--paper);
  display:flex;flex-direction:column;padding:20px 0;
}
.sidebar .brand{
  font-family:var(--font-display);font-size:20px;font-weight:600;
  padding:0 20px 18px;border-bottom:1px solid rgba(234,230,220,.15);margin-bottom:10px;
  display:flex;align-items:center;gap:10px;color:var(--paper-raised);
}
.sidebar .brand .mark{
  width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--crimson) 0 50%, var(--paper) 50% 100%);
  border:2px solid var(--paper);position:relative;flex-shrink:0;
}
.sidebar .brand .mark::after{content:"";position:absolute;inset:9px;background:var(--ink);border-radius:50%;border:2px solid var(--paper);}
.navlist{display:flex;flex-direction:column;gap:2px;padding:6px 10px;}
.navlink{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
  color:var(--paper);opacity:.72;text-decoration:none;cursor:pointer;font-size:14px;border:none;background:none;
  text-align:left;width:100%;
}
.navlink svg{width:17px;height:17px;flex-shrink:0;}
.navlink:hover{opacity:1;background:rgba(234,230,220,.08);}
.navlink.active{opacity:1;background:rgba(234,230,220,.14);color:#fff;}
.sidebar-foot{margin-top:auto;padding:14px 20px 4px;font-size:11.5px;color:rgba(234,230,220,.5);border-top:1px solid rgba(234,230,220,.12);}

.main{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.page{max-width:1180px;margin:0 auto;padding:28px 28px 90px;}

.pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.pagehead h1{font-size:26px;}
.pagehead .sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}

/* ---------- Mobile bottom nav ---------- */
.tabbar{display:none;}
@media (max-width:860px){
  .sidebar{display:none;}
  .shell{flex-direction:column;}
  .tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:40;border-top:1px solid rgba(0,0,0,.2);
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tabbar button{
    flex:0 0 auto;min-width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
    color:rgba(234,230,220,.55);font-size:10px;padding:6px 4px;border-radius:8px;
  }
  .tabbar button svg{width:19px;height:19px;}
  .tabbar button.active{color:#fff;}
  .page{padding:18px 16px 84px;}
  .main{padding-bottom:60px;}
}

/* ---------- Cards / surfaces ---------- */
.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);}
.panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}

.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:22px;}
.kpi{background:var(--paper-raised);padding:16px 18px;}
.kpi .num{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.1;}
.kpi .label{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.kpi .delta{font-size:11px;margin-top:6px;color:var(--moss);}

.section-title{font-size:13px;text-transform:none;color:var(--ink-soft);margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}

/* ---------- Buttons / inputs ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--line-strong);background:var(--paper-raised);color:var(--ink);cursor:pointer;
  font-size:13.5px;font-weight:500;white-space:nowrap;
}
.btn:hover{border-color:var(--ink-soft);}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn.primary:hover{background:#000;}
.btn.accent{background:var(--crimson);color:#fff;border-color:var(--crimson);}
.btn.accent:hover{background:#8a2f2f;}
.btn.ghost{background:transparent;border-color:transparent;}
.btn.ghost:hover{background:var(--paper-sunken);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn svg{width:14px;height:14px;}

input[type=text],input[type=search],input[type=number],select,textarea{
  font-family:inherit;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  background:var(--paper-raised);color:var(--ink);font-size:13.5px;
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--sky);outline-offset:1px;}

.searchbar{display:flex;align-items:center;gap:8px;background:var(--paper-raised);border:1px solid var(--line-strong);border-radius:20px;padding:7px 14px;flex:1;min-width:160px;}
.searchbar svg{width:15px;height:15px;color:var(--ink-soft);flex-shrink:0;}
.searchbar input{border:none;background:none;flex:1;padding:0;min-width:0;}
.searchbar input:focus{outline:none;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:20px;border:1px solid var(--line-strong);background:var(--paper-raised);font-size:12.5px;cursor:pointer;color:var(--ink-soft);}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.02em;}
.badge.owned{background:#e4ede1;color:var(--moss);}
.badge.missing{background:var(--paper-sunken);color:var(--ink-soft);}
.badge.pick{background:#f4e7cd;color:var(--brass);}
.badge.new{background:#e4ede1;color:var(--moss);}
.badge.update{background:#e6eef3;color:var(--sky);}
.badge.review{background:#f6dede;color:var(--crimson);}
.badge.dup{background:var(--paper-sunken);color:var(--ink-soft);}

/* ---------- Grids ---------- */
.grid-species{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.spcard{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;
  cursor:pointer;position:relative;display:flex;flex-direction:column;gap:6px;
}
.spcard:hover{border-color:var(--ink-soft);box-shadow:var(--shadow);}
.spcard.missing{opacity:.5;}
.spcard.selected-merge{outline:2px solid var(--brass);outline-offset:-2px;}
.spcard-check{position:absolute;top:6px;right:6px;font-size:16px;line-height:1;background:var(--paper);border-radius:4px;padding:1px 3px;z-index:2;}
.type-row{display:flex;gap:4px;flex-wrap:wrap;}
.type-badge{display:inline-block;color:#fff;font-size:9.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:20px;text-shadow:0 1px 1px rgba(0,0,0,.25);}
.spcard .dex{font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.spcard .nm{font-family:var(--font-display);font-weight:600;font-size:14.5px;line-height:1.2;}
.spcard .tax{font-size:10.5px;color:var(--ink-soft);}
.spcard .badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;}

/* ---------- Table ---------- */
table.datatable{width:100%;border-collapse:collapse;font-size:13px;}
table.datatable th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;}
table.datatable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.datatable tr:hover td{background:var(--paper-sunken);}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-raised);}

/* ---------- Binder ---------- */
.binder-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.binder-pagelabel{font-family:var(--font-display);font-size:17px;}
.binder-page{
  background:linear-gradient(180deg,#1c3a2c,#0f241b);border-radius:14px;padding:16px;box-shadow:var(--shadow-lg);
}
.binder-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.pocket{
  aspect-ratio:2.5/3.5;background:var(--paper-raised);border-radius:8px;position:relative;overflow:hidden;
  border:1px solid rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4), 0 2px 6px rgba(0,0,0,.35);
  display:flex;flex-direction:column;cursor:pointer;
}
.pocket.empty{background:var(--paper-sunken);}
.pocket.label{
  background:var(--ink);color:var(--paper);align-items:center;justify-content:center;text-align:center;padding:10px;
}
.pocket.label .lv{font-size:9px;letter-spacing:.05em;color:var(--brass-soft);margin-bottom:6px;}
.pocket.label .nm{font-family:var(--font-display);font-size:13.5px;font-weight:600;line-height:1.25;}
.pocket .top{padding:7px 8px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:4px;}
.pocket .dexno{font-size:9px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.pocket .typedots{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;}
.typedot{
  display:inline-block;color:#fff;font-size:6.5px;font-weight:700;letter-spacing:.01em;
  padding:1.5px 3px;border-radius:4px;text-shadow:0 1px 1px rgba(0,0,0,.3);line-height:1.3;
}
.pocket .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 8px;text-align:center;}
.pocket .nm{font-family:var(--font-display);font-weight:600;font-size:12.5px;line-height:1.2;}
.pocket .evomini{font-size:8px;color:var(--ink-soft);margin-top:2px;line-height:1.2;}
.pocket .foot{padding:0 8px 8px;display:flex;justify-content:center;gap:3px;}
.pocket.owned{box-shadow:inset 0 0 0 2px var(--moss), 0 2px 6px rgba(0,0,0,.35);}
.pocket.haspick{box-shadow:inset 0 0 0 2px var(--brass), 0 2px 6px rgba(0,0,0,.35);}
.pocket.missing .nm{color:var(--ink-soft);}
.dot{width:6px;height:6px;border-radius:50%;}
.dot.owned{background:var(--moss);}
.dot.pick{background:var(--brass);}
@media (max-width:860px){
  .binder-grid{gap:7px;}
  .binder-page{padding:10px;border-radius:10px;}
  .pocket .nm{font-size:11px;}
}

/* ---------- Import ---------- */
.dropzone{
  border:2px dashed var(--line-strong);border-radius:var(--radius);padding:38px 20px;text-align:center;
  background:var(--paper-raised);cursor:pointer;
}
.dropzone.drag{border-color:var(--crimson);background:#f6ecec;}
.dropzone svg{width:30px;height:30px;color:var(--ink-soft);margin-bottom:10px;}
.import-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:16px 0;}
.import-summary .cell{background:var(--paper-raised);padding:14px;text-align:center;}
.import-summary .cell .n{font-family:var(--font-display);font-size:22px;}
.import-summary .cell .l{font-size:11px;color:var(--ink-soft);margin-top:2px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(20,22,26,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--paper-raised);border-radius:var(--radius);max-width:560px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper-raised);}
.modal-head h3{font-size:17px;}
.modal-body{padding:18px;}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--paper-raised);}
.iconbtn{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:4px;}
.iconbtn svg{width:18px;height:18px;}
.iconbtn.xs{width:16px;height:16px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;}
.iconbtn.xs svg{width:10px;height:10px;}
.mark-owned-btn{background:var(--paper-raised);color:var(--ink-soft);box-shadow:0 0 0 1px var(--line);}
.mark-owned-btn:hover{color:var(--brass);box-shadow:0 0 0 1px var(--brass);}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.emptystate{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.emptystate svg{width:34px;height:34px;margin-bottom:12px;opacity:.5;}
.emptystate h3{color:var(--ink);margin-bottom:6px;font-size:17px;}

.taxlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.taxrow{background:var(--paper-raised);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px;}
.taxrow:hover{background:var(--paper-sunken);}
.taxrow .nm{font-family:var(--font-display);font-weight:600;font-size:14.5px;}
.taxrow .stats{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--ink-soft);flex-shrink:0;}
.barbg{width:80px;height:5px;background:var(--paper-sunken);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px;}
.barfg{height:100%;background:var(--moss);}
.crumbs{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.crumbs .c{cursor:pointer;}
.crumbs .c:hover{color:var(--ink);text-decoration:underline;}

.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
@media (max-width:860px){.toast-wrap{bottom:74px;}}
.toast{background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:20px;font-size:13px;box-shadow:var(--shadow-lg);}

.starbtn{cursor:pointer;border:1px solid var(--line-strong);background:var(--paper-raised);border-radius:20px;padding:5px 12px;font-size:12px;display:inline-flex;align-items:center;gap:5px;}
.starbtn.active{background:#f4e7cd;border-color:var(--brass);color:var(--brass);}

.cardlist{display:flex;flex-direction:column;gap:8px;}
.cardrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-raised);}
.cardrow .info{flex:1;min-width:0;}
.cardrow .set{font-size:12px;color:var(--ink-soft);}
.cardrow .meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.cardrow .val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}

.pager{display:flex;align-items:center;gap:8px;}
.pager input{width:64px;text-align:center;}

.needsreview-row select{max-width:220px;}

.hidden{display:none !important;}

.globalbar{padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--line);position:relative;z-index:50;}
.globalbar .gs-wrap{max-width:520px;margin:0 auto;}
@media (max-width:860px){.globalbar{padding:8px 14px;}}
.gs-dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:420px;overflow-y:auto;z-index:60;}
.gs-dropdown.open{display:block;}
.gs-row{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);}
.gs-row:last-child{border-bottom:none;}
.gs-row:hover{background:var(--paper-sunken);}
.gs-thumb{width:38px;height:38px;flex-shrink:0;border-radius:var(--radius-sm);overflow:hidden;background:var(--paper-sunken);}
.gs-info{flex:1;min-width:0;}
.gs-nm{font-family:var(--font-display);font-weight:600;font-size:13.5px;display:flex;align-items:baseline;gap:6px;}
.gs-dex{font-size:10px;color:var(--ink-soft);font-weight:400;font-variant-numeric:tabular-nums;}
.gs-tax{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.gs-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.gs-empty{padding:14px;font-size:12.5px;color:var(--ink-soft);text-align:center;}
.imgwrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--paper-sunken);}
.imgwrap img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1;}
.imgwrap.pocket-img img{object-fit:cover;}
.imgfallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);opacity:.4;}
.imgfallback svg{width:38%;height:38%;}
.cardrow-art{width:52px;height:52px;flex-shrink:0;border-radius:var(--radius-sm);overflow:hidden;}
.spcard-art{width:100%;aspect-ratio:1/1;border-radius:var(--radius-sm);overflow:hidden;margin-bottom:2px;}
.species-hero{width:76px;height:76px;flex-shrink:0;border-radius:50%;overflow:hidden;background:var(--paper-sunken);border:2px solid var(--line-strong);}
.pocket-art{position:absolute;inset:0;}
.pocket-overlay{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;min-height:0;background:linear-gradient(180deg, rgba(245,243,234,.12) 0%, rgba(245,243,234,.55) 55%, rgba(245,243,234,.92) 100%);}
.pocket.missing .pocket-overlay{background:none;}
.taxmini{font-size:9px;color:var(--ink-soft);margin-top:1px;}
.taxchip{background:var(--paper-sunken);color:var(--ink-soft);}
.chip.sm{padding:3px 8px;font-size:10.5px;}

.binder-edit-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;}
.binder-edit-toolbar .hint{font-size:12px;color:var(--ink-soft);flex:1;min-width:200px;}
.binder-edit-toolbar .btns{display:flex;gap:8px;flex-wrap:wrap;}
.pocket.label.editable{cursor:pointer;}
.pocket.label .label-edit-controls{display:flex;gap:4px;justify-content:center;margin-top:6px;}
.pocket.label.selected-merge{outline:2px solid var(--brass);outline-offset:-2px;}
.pocket.label.merged-away{opacity:.45;cursor:pointer;}
.pocket.label .merged-note{font-size:10px;font-style:italic;}
.iconbtn.sm{width:22px;height:22px;padding:0;font-size:12px;}
.iconbtn.sm.active{background:var(--brass-soft);color:var(--paper);}

.evofam-list{display:flex;flex-direction:column;gap:10px;}
.evofam-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
.evofam-chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.evofam-stage{display:flex;flex-direction:column;gap:6px;}
.evo-arrow{color:var(--ink-soft);opacity:.6;flex-shrink:0;width:18px;}
.evofam-node{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 10px 5px 5px;cursor:pointer;font-family:var(--font-body);text-align:left;}
.evofam-node:hover{border-color:var(--line-strong);}
.evofam-node.missing{opacity:.5;}
.evofam-thumb{width:32px;height:32px;flex-shrink:0;border-radius:50%;overflow:hidden;background:var(--paper-sunken);}
.evofam-nm{font-size:12.5px;font-weight:600;white-space:nowrap;}
.evofam-qty{font-weight:400;color:var(--ink-soft);}

.species-picker{position:relative;}
.species-picker input.species-picker-input{width:100%;box-sizing:border-box;}
.species-picker .gs-dropdown{max-height:240px;}
.species-picker .gs-row{font-size:13px;padding:7px 10px;}

</style>

// Groups a list of species by evolution family, orders the families by
// (the base/first-stage member's main type, alphabetically) then (the base
// member's name, alphabetically), and orders each family's own members from
// lowest evolution stage to highest. This keeps a whole line together (e.g.
// Vullaby then Mandibuzz) instead of interleaving unrelated families that
// happen to share a type (e.g. Mandibuzz, Murkrow, Vullaby alphabetically).
function sortByFamilyThenEvo(list){
  const byFam = new Map();
  for(const s of list){
    const fam = s.evoFamily || s.name;
    if(!byFam.has(fam)) byFam.set(fam, []);
    byFam.get(fam).push(s);
  }
  const families = [...byFam.values()].map(members => {
    const ordered = members.slice().sort((a,b) => (a.evoOrder||0)-(b.evoOrder||0));
    const base = ordered.find(m=>!m.variant) || ordered[0];
    return { members: ordered, base, type: (base.types && base.types[0]) || '' };
  });
  families.sort((a,b) => a.type.localeCompare(b.type) || a.base.name.localeCompare(b.base.name));
  const result = [];
  families.forEach(f => result.push(...f.members));
  return result;
}

function computeBinderLayout(species){
  const byPath = new Map();
  for(const s of species){
    const path = [s.group, s.category, s.subcategory].join('||');
    if(!byPath.has(path)) byPath.set(path, []);
    byPath.get(path).push(s);
  }
  const rows = [];
  let slot = 0, pocket = 0, page = 1;
  let lastGroup=null,lastCat=null,lastSub=null;
  function place(row){
    slot++; pocket++;
    let pageBreak=null;
    if(pocket>9){ pocket=1; page++; pageBreak='NEW PAGE'; }
    row.slot=slot; row.pocket=pocket; row.page=page; row.pageBreak=pageBreak;
    rows.push(row);
  }
  // Every new category — and every new subcategory within it — always starts
  // on a fresh binder page. This leaves a few empty pockets at the end of some
  // pages, but means recategorizing a Pokémon, or adding/removing a category
  // or subcategory, never shifts the page numbers of anything that comes after it.
  function forceNewPage(){
    if(pocket!==0){ pocket=0; page++; }
  }
  for(const group of GROUP_ORDER){
    const cats = CATEGORY_ORDER[group]||[];
    for(const category of cats){
      const subs = SUBCATEGORY_ORDER[category]||[category];
      for(const subcategory of subs){
        const path = [group,category,subcategory].join('||');
        if(!byPath.has(path)) continue;
        const list = sortByFamilyThenEvo(byPath.get(path));
        if(!list.length) continue;
        if(category!==lastCat || group!==lastGroup || subcategory!==lastSub){
          forceNewPage();
        }
        if(group!==lastGroup){
          place({type:'GROUP LABEL',labelLevel:'GROUP',display:group,dex:null,group,category,subcategory,evoFamily:null,evoOrder:null,key:'GROUP::'+group,taxBreak:'NEW GROUP'});
        }
        if(category!==lastCat || group!==lastGroup){
          place({type:'CATEGORY LABEL',labelLevel:'CATEGORY',display:category,dex:null,group,category,subcategory,evoFamily:null,evoOrder:null,key:'CATEGORY::'+category,taxBreak: group!==lastGroup ? null : 'NEW CATEGORY'});
        }
        place({type:'SUBCATEGORY LABEL',labelLevel:'SUBCATEGORY',display:subcategory,dex:null,group,category,subcategory,evoFamily:null,evoOrder:null,key:'SUBCATEGORY::'+subcategory,taxBreak:null});
        for(const s of list){
          place({type:'POKÉMON',labelLevel:null,display:s.name,dex:s.dex,group,category,subcategory,evoFamily:s.evoFamily,evoOrder:s.evoOrder});
        }
        lastGroup=group; lastCat=category; lastSub=subcategory;
      }
    }
  }
  return rows;
}

function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

/* simple djb2-ish hash for stable composite ids */
function stableId(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return 'c' + h.toString(36);
}

let binderByPage, BINDER_MAX_PAGE, binderSlotBySpecies;
function rebuildBinderIndexes(){
  binderByPage = new Map();
  BINDER_MAX_PAGE = 1;
  BINDER.forEach(b => {
    if(!binderByPage.has(b.page)) binderByPage.set(b.page, []);
    binderByPage.get(b.page).push(b);
    if(b.page > BINDER_MAX_PAGE) BINDER_MAX_PAGE = b.page;
  });
  binderByPage.forEach(list => list.sort((a,b)=>a.pocket-b.pocket));
  binderSlotBySpecies = new Map();
  BINDER.forEach(b => { if(b.type==='POKÉMON') binderSlotBySpecies.set(b.display, b); });
}
rebuildBinderIndexes();
function rebuildBinder(){
  BINDER = computeBinderLayout(SPECIES);
  rebuildBinderIndexes();
}

function loadJSON(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ console.error('load failed', key, e); return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ console.error('save failed', key, e); toast('Could not save — storage may be full.'); return false; }
}

let STATE = {
  collection: loadJSON(LS_KEYS.collection, []),   // array of card records
  picks: loadJSON(LS_KEYS.picks, {}),             // speciesName -> cardId
  history: loadJSON(LS_KEYS.history, []),         // import batches
  overrides: loadJSON(LS_KEYS.overrides, {}),     // lowercased raw name -> species name
  settings: loadJSON(LS_KEYS.settings, { currency:'USD' }),
  labelOverrides: loadJSON(LS_KEYS.labelOverrides, {}), // label key (e.g. "CATEGORY::Frogs & Toads") -> custom label text
  mergedLabels: loadJSON(LS_KEYS.mergedLabels, {}),     // label key -> label key it's combined into
  categoryOverrides: loadJSON(LS_KEYS.categoryOverrides, {}), // species name -> {group,category,subcategory}
  manualOwned: loadJSON(LS_KEYS.manualOwned, {}), // species name -> true (manually marked owned, no card record)
  taxonomy: loadJSON(LS_KEYS.taxonomy, null), // {groups,categories,subcategories} - your custom category list, if you've edited it
  familyOverrides: loadJSON(LS_KEYS.familyOverrides, {}), // species name -> {evoFamily,evoOrder} - your custom evolution-family edits

});

/* ---------------- Pokémon artwork (official art, hotlinked — never stored locally) ---------------- */
function speciesImageUrl(s){
  if(!s || !s.dex || typeof s.dex !== 'number') return null;
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${s.dex}.png`;
}
// Wrapper + fallback icon behind the <img>; if the artwork 404s (e.g. species
// too new for the sprite repo) the broken image just hides and the icon shows.
function speciesImgTag(s, cls){
  const url = speciesImageUrl(s);
  return `<div class="imgwrap ${cls||''}">
    <div class="imgfallback">${ICONS.photo}</div>
    ${url ? `<img src="${url}" alt="${esc(s.name)}" loading="lazy" onerror="this.style.display='none'">` : ''}
  </div>`;
}
// Category › Subcategory, skipping any level that's just "—".
function taxBreadcrumb(s){
  if(!s) return '';
  const parts = [s.category];
  if(s.subcategory && s.subcategory!=='—') parts.push(s.subcategory);
  return parts.join(' › ');
}

function persist(part){
  if(part==='collection') saveJSON(LS_KEYS.collection, STATE.collection);
  else if(part==='picks') saveJSON(LS_KEYS.picks, STATE.picks);
  else if(part==='history') saveJSON(LS_KEYS.history, STATE.history);
  else if(part==='overrides') saveJSON(LS_KEYS.overrides, STATE.overrides);
  else if(part==='settings') saveJSON(LS_KEYS.settings, STATE.settings);
  else if(part==='labelOverrides') saveJSON(LS_KEYS.labelOverrides, STATE.labelOverrides);
  else if(part==='mergedLabels') saveJSON(LS_KEYS.mergedLabels, STATE.mergedLabels);
  else if(part==='categoryOverrides') saveJSON(LS_KEYS.categoryOverrides, STATE.categoryOverrides);
  else if(part==='manualOwned') saveJSON(LS_KEYS.manualOwned, STATE.manualOwned);
  else if(part==='taxonomy') saveJSON(LS_KEYS.taxonomy, STATE.taxonomy);
  else if(part==='familyOverrides') saveJSON(LS_KEYS.familyOverrides, STATE.familyOverrides);
  // Push to the cloud (if connected) whenever real data changes. Settings
  // writes are excluded so that pushToCloud() recording its own
  // lastPushedAt timestamp (a settings write) can't trigger itself again.
  if(part!=='settings' && STATE.settings.cloudSync && STATE.settings.cloudSync.enabled) scheduleCloudPush();
}

/* ---------------- derived collection stats (recomputed on demand, cheap) ---------------- */
function collectionStats(){
  let totalCards=0, totalValue=0, costTotal=0;
  const speciesOwned = new Set();
  const setsSeen = new Set();
  for(const c of STATE.collection){
    totalCards += c.quantity;
    totalValue += (c.marketPrice||0) * c.quantity;
    costTotal += (c.costPaid||0) * c.quantity;
    if(c.species) speciesOwned.add(c.species);
    if(c.set) setsSeen.add(c.set);
  }
  Object.keys(STATE.manualOwned).forEach(nm => speciesOwned.add(nm));
  const totalSpecies = SPECIES.length;
  const binderPickCount = Object.keys(STATE.picks).length;
  return {
    totalCards, totalValue, costTotal,
    uniqueSpecies: speciesOwned.size,
    totalSpecies,
    collectionPct: totalSpecies ? (speciesOwned.size/totalSpecies*100) : 0,
    binderPct: totalSpecies ? (binderPickCount/totalSpecies*100) : 0,
    binderPickCount,
    setsCount: setsSeen.size,
    speciesOwnedSet: speciesOwned,
  };
}

function cardsForSpecies(name){
  return STATE.collection.filter(c => c.species === name);
}
function speciesOwnedQty(name){
  return cardsForSpecies(name).reduce((s,c)=>s+c.quantity,0);
}
// Whether a species should show as "owned" anywhere in the app — either a
// real card is logged for it, or it's been manually marked (the workaround
// for species whose imported cards didn't name-match during CSV import,
// which happens most often with regional-variant cards).
function isOwned(name){
  return speciesOwnedQty(name) > 0 || !!STATE.manualOwned[name];
}
function toggleManualOwned(name){
  if(STATE.manualOwned[name]) delete STATE.manualOwned[name];
  else STATE.manualOwned[name] = true;
  persist('manualOwned');
  render();
}

/* ============================================================
   Shared "find a Pokémon" search — powers the always-visible
   global search bar plus the inline searches on the Binder and
   Extras Binder pages. Every instance shares this same matching
   + result-row + wiring logic.
   ============================================================ */
function speciesSearchMatches(q, limit){
  limit = limit || 8;
  if(!q || !q.trim()) return [];
  const nq = norm(q);
  const nqDigits = q.trim().replace(/^#/,'');
  const isNumericQuery = /^\d+$/.test(nqDigits);
  const scored = [];
  for(const s of SPECIES){
    const n = norm(s.name);
    const dexStr = s.dex!=null ? String(s.dex) : '';
    let score = -1;
    if(n === nq) score = 0;
    else if(isNumericQuery && dexStr === nqDigits) score = 0;
    else if(n.startsWith(nq)) score = 1;
    else if(isNumericQuery && dexStr.length && dexStr.startsWith(nqDigits)) score = 1;
    else if(n.includes(nq)) score = 2;
    else if(norm(s.evoFamily||'').includes(nq)) score = 3;
    if(score >= 0) scored.push({ s, score });
  }
  scored.sort((a,b) => a.score - b.score || (a.s.dex??99999) - (b.s.dex??99999));
  return scored.slice(0, limit).map(x => x.s);
}
function speciesResultRow(s){
  const qty = speciesOwnedQty(s.name);
  const owned = isOwned(s.name);
  const slot = binderSlotBySpecies.get(s.name);
  const taxLabel = taxBreadcrumb(s);
  return `
    <div class="gs-row" data-nav-species="${esc(s.name)}">
      <div class="gs-thumb">${speciesImgTag(s,'gs-thumb-img')}</div>
      <div class="gs-info">
        <div class="gs-nm">${esc(s.name)}<span class="gs-dex">${s.dex ? '#'+String(s.dex).padStart(4,'0') : ''}</span></div>
        <div class="gs-tax">${esc(taxLabel)}</div>
      </div>
      <div class="gs-meta">
        ${owned ? `<span class="badge owned">Owned ×${qty}</span>` : `<span class="badge missing">Missing</span>`}
        ${slot ? `<span class="chip sm" data-goto-binder="${slot.page}">${ICONS.binder} Pg ${slot.page}</span>` : `<span class="chip sm" style="opacity:.5;">Not in binder</span>`}
      </div>
    </div>`;
}
function wireSpeciesSearchInput(inputEl, dropdownEl){
  if(!inputEl || !dropdownEl) return;
  const update = () => {
    const q = inputEl.value;
    if(!q || !q.trim()){ dropdownEl.innerHTML=''; dropdownEl.classList.remove('open'); return; }
    const matches = speciesSearchMatches(q, 8);
    dropdownEl.innerHTML = matches.length
      ? matches.map(speciesResultRow).join('')
      : `<div class="gs-empty">No species match “${esc(q)}”</div>`;
    dropdownEl.classList.add('open');
  };
  inputEl.addEventListener('input', debounce(update, 120));
  inputEl.addEventListener('focus', update);
}
function closeAllSearchDropdowns(){
  $$('.gs-dropdown.open').forEach(d => d.classList.remove('open'));
}

/* Reusable searchable species picker — a text input with a live-filtered
   dropdown, backed by a hidden input carrying the actual selected species
   name. Used anywhere the app needs the user to pick one of 1000+ species
   (import match review, manually reassigning a card's species, etc.) instead
   of scrolling a giant native <select>. */
function speciesPickerHTML({ id, hiddenClass, current, placeholder, extraAttrs }){
  const val = current || '';
  return `
    <div class="species-picker" data-for="${esc(id)}">
      <input type="text" class="species-picker-input" autocomplete="off" placeholder="${esc(placeholder||'Type to search species…')}" value="${esc(val)}">
      <input type="hidden" class="${esc(hiddenClass||'')}" id="${esc(id)}" value="${esc(val)}" ${extraAttrs||''}>
      <div class="gs-dropdown"></div>
    </div>`;
}
function speciesPickerRow(s){
  return `<div class="gs-row spp-row" data-name="${esc(s.name)}"><div class="gs-nm">${esc(s.name)}${s.dex?`<span class="gs-dex">#${String(s.dex).padStart(4,'0')}</span>`:''}</div></div>`;
}
function wireSpeciesPickers(root){
  (root||document).querySelectorAll('.species-picker').forEach(wrap=>{
    if(wrap.dataset.wired) return;
    wrap.dataset.wired = '1';
    const input = wrap.querySelector('.species-picker-input');
    const hidden = wrap.querySelector('input[type="hidden"]');
    const dropdown = wrap.querySelector('.gs-dropdown');
    const update = () => {
      const q = input.value;
      if(!q || !q.trim()){ dropdown.innerHTML=''; dropdown.classList.remove('open'); return; }
      const matches = speciesSearchMatches(q, 30);
      dropdown.innerHTML = matches.length ? matches.map(speciesPickerRow).join('') : `<div class="gs-empty">No species match "${esc(q)}"</div>`;
      dropdown.classList.add('open');
    };
    input.addEventListener('input', () => { hidden.value=''; update(); });
    input.addEventListener('focus', update);
    input.addEventListener('blur', () => {
      setTimeout(() => {
        // If they typed an exact species name but never clicked a suggestion,
        // still count it as a real pick rather than silently discarding it.
        if(!hidden.value){
          const typed = input.value.trim();
          const exact = typed && SPECIES.find(s=>s.name.toLowerCase()===typed.toLowerCase());
          if(exact){ hidden.value = exact.name; input.value = exact.name; }
        }
        dropdown.classList.remove('open');
      }, 150);
    });
    dropdown.addEventListener('mousedown', e => {
      const row = e.target.closest('.spp-row');
      if(!row) return;
      e.preventDefault();
      const name = row.dataset.name;
      input.value = name; hidden.value = name;
      dropdown.classList.remove('open'); dropdown.innerHTML = '';
      hidden.dispatchEvent(new Event('change'));
    });
  });
}

/* ============================================================
   Import engine — CSV/XLSX parsing, species matching, dedup
   ============================================================ */

const SUFFIX_RE = /\s*\([^()]*\)\s*$/;
const CARDMECH_RE = /\s+(VMAX|VSTAR|V-UNION|GX|EX|ex|V|BREAK|Prime|LV\.\s*X|Star|Legend|TAG TEAM|&\s*\w+\s*GX)\s*$/;
const PREFIX_RE = /^(Alolan|Galarian|Hisuian|Paldean|Mega|Dark|Light|Shining|Shadow Rider|Shadow|Ice Rider|Crowned|Rapid Strike|Single Strike|Crystal|Radiant|Team Rocket'?s|Rocket'?s)\s+/i;
const POSSESSIVE_RE = /^[A-Z][A-Za-z.]*'s\s+/;

function stripCardMechanics(name){
  let n = name;
  let changed = true;
  while(changed){
    changed = false;
    const stripped = n.replace(SUFFIX_RE,'').trim();
    if(stripped !== n){ n = stripped; changed = true; }
  }
  changed = true;
  while(changed){
    changed = false;
    const stripped = n.replace(CARDMECH_RE,'').trim();
    if(stripped !== n){ n = stripped; changed = true; }
  }
  return n;
}
function stripRegionalPrefix(name){
  return name.replace(PREFIX_RE,'').replace(POSSESSIVE_RE,'').trim();
}

/* Resolve a Collectr product name to a species name (or null if unresolved).
   Priority: user override table -> exact species name -> case-insensitive
   species name -> built-in alias table -> heuristic suffix/prefix stripping
   (exact + alias). The case-insensitive step matters most for regional-form
   names ("Hisuian Growlithe", "Galarian Meowth", etc.) — without it, any
   capitalization difference from Collectr falls through to prefix-stripping
   and silently matches the base species instead of the actual variant. */
const speciesNameByLower = new Map(SPECIES.map(s => [s.name.toLowerCase(), s.name]));
function resolveSpecies(rawName){
  const key = norm(rawName);
  if(STATE.overrides[key]) return STATE.overrides[key];
  if(speciesByName.has(rawName.trim())) return rawName.trim();
  const ciMatch = speciesNameByLower.get(rawName.trim().toLowerCase());
  if(ciMatch) return ciMatch;
  if(aliasLower[key]) return aliasLower[key];
  const stripped = stripRegionalPrefix(stripCardMechanics(rawName));
  if(speciesByName.has(stripped)) return stripped;
  const strippedKey = norm(stripped);
  if(aliasLower[strippedKey]) return aliasLower[strippedKey];
  return null;
}

/* Composite identity key for a Collectr row -> stable card id */
function compositeKey(row){
  const parts = [row.set, row.cardNumber, row.productName, row.variance, row.grade, row.condition]
    .map(v => norm(v));
  return stableId(parts.join('|'));
}

/* ---------------- CSV parsing (RFC4180-ish) ---------------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r.length===1 && r[0]!==''));
}

/* Map a header row + data row into a normalized Collectr row object.
   Handles the standard Collectr export column names, case-insensitively. */
function mapCollectrRow(headers, arr){
  const idx = {};
  headers.forEach((h,i) => idx[norm(h)] = i);
  const get = (...names) => {
    for(const n of names){ const i = idx[norm(n)]; if(i!=null && arr[i]!=null) return String(arr[i]).trim(); }
    return '';
  };
  // "Market Price" column ships as "Market Price (As of YYYY-MM-DD)" — the date varies per export,
  // so match any header that starts with "market price" rather than an exact name.
  const marketPriceHeader = Object.keys(idx).find(h => h.startsWith('market price'));
  const marketPriceRaw = marketPriceHeader != null ? String(arr[idx[marketPriceHeader]]||'').trim() : get('Market Price');
  return {
    portfolio: get('Portfolio Name','Portfolio'),
    category: get('Category'),
    set: get('Set'),
    productName: get('Product Name','Card Name'),
    cardNumber: get('Card Number','Card #'),
    rarity: get('Rarity'),
    variance: get('Variance','Variant'),
    grade: get('Grade'),
    condition: get('Card Condition','Condition'),
    costPaid: parseFloat(get('Average Cost Paid','Cost Paid'))||0,
    quantity: parseInt(get('Quantity'),10)||1,
    marketPrice: parseFloat(marketPriceRaw)||0,
    dateAdded: get('Date Added') || todayISO(),
    notes: get('Notes'),
  };
}

function parseCollectrFile(filename, arrOfArrays){
  const headers = arrOfArrays[0].map(h => String(h||''));
  const out = [];
  for(let i=1;i<arrOfArrays.length;i++){
    const r = arrOfArrays[i];
    if(!r || r.every(v => v==null || String(v).trim()==='')) continue;
    out.push(mapCollectrRow(headers, r));
  }
  return out;
}

/* Build an import preview from parsed rows, scoped to a chosen portfolio. */
function buildImportPreview(rows, portfolioFilter){
  const wantPortfolio = norm(portfolioFilter);
  const portfoliosSeen = {};
  rows.forEach(r => { const p = r.portfolio || '(none)'; portfoliosSeen[p] = (portfoliosSeen[p]||0)+1; });

  const inScope = rows.filter(r => norm(r.portfolio) === wantPortfolio);
  const items = inScope.map(row => {
    const species = resolveSpecies(row.productName);
    const id = compositeKey(row);
    const existing = STATE.collection.find(c => c.id === id);
    let status;
    if(!species) status = 'review';
    else if(!existing) status = 'new';
    else {
      const changed = existing.quantity !== row.quantity ||
        Math.abs((existing.marketPrice||0) - row.marketPrice) > 0.001 ||
        Math.abs((existing.costPaid||0) - row.costPaid) > 0.001;
      status = changed ? 'update' : 'duplicate';
    }
    return { row, species, id, status, existing };
  });

  return { items, portfoliosSeen, totalRows: rows.length, inScopeCount: inScope.length };
}

function commitImport(preview, filename, chosenPortfolio){
  let added=0, updated=0, unchanged=0, reviewSkipped=0, learned=0;
  const batchId = uid();
  for(const item of preview.items){
    const species = item.species || (item.manualSpecies || null);
    if(!species && !item.acceptUnlinked){
      reviewSkipped++;
      continue;
    }
    if(item.manualSpecies){
      STATE.overrides[norm(item.row.productName)] = item.manualSpecies;
      learned++;
    }
    const rec = {
      id: item.id,
      species: species,
      productName: item.row.productName,
      set: item.row.set,
      cardNumber: item.row.cardNumber,
      rarity: item.row.rarity,
      variance: item.row.variance,
      grade: item.row.grade,
      condition: item.row.condition,
      costPaid: item.row.costPaid,
      marketPrice: item.row.marketPrice,
      quantity: item.row.quantity,
      dateAdded: item.row.dateAdded,
      notes: item.row.notes,
      importBatch: batchId,
    };
    if(item.status === 'new' || (item.status==='review' && !item.existing)){
      STATE.collection.push(rec);
      added++;
    } else if(item.status === 'update' || (item.status==='review' && item.existing)){
      const i = STATE.collection.findIndex(c => c.id === item.id);
      if(i>=0){ STATE.collection[i] = rec; updated++; } else { STATE.collection.push(rec); added++; }
    } else {
      unchanged++;
    }
  }
  if(learned) persist('overrides');
  persist('collection');
  const batch = {
    id: batchId, date: new Date().toISOString(), filename,
    portfolio: chosenPortfolio,
    totalRows: preview.totalRows, inScope: preview.inScopeCount,
    added, updated, unchanged, reviewSkipped,
  };
  STATE.history.unshift(batch);
  persist('history');
  return batch;
}

   ============================================================ */
function toast(msg, ms=2600){
  let wrap = $('.toast-wrap');
  if(!wrap){ wrap = document.createElement('div'); wrap.className='toast-wrap'; document.body.appendChild(wrap); }
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, ms);
}

function openModal(title, bodyHTML, footHTML){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="iconbtn" data-action="close-modal">${ICONS.close}</button></div>
      <div class="modal-body">${bodyHTML}</div>
      ${footHTML ? `<div class="modal-foot">${footHTML}</div>` : ''}
    </div>`;
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  return overlay;
}

function confirmAction(message, onYes){

    `<button class="btn ghost" data-action="close-modal">Cancel</button>
     <button class="btn accent" id="confirmYes">Confirm</button>`);

}

function currentRoute(){
  const hash = location.hash.replace(/^#\/?/, '');
  const [id, ...rest] = hash.split('/');
  return { id: id || 'dashboard', args: rest };
}

function navHTML(activeId, mobile){
  return ROUTES.map(r => mobile
    ? `<button class="${r.id===activeId?'active':''}" data-nav="${r.id}">${ICONS[r.icon]}<span>${r.label.replace(' History','')}</span></button>`
    : `<button class="navlink ${r.id===activeId?'active':''}" data-nav="${r.id}">${ICONS[r.icon]}<span>${r.label}</span></button>`
  ).join('');
}

function renderShell(){
  const { id } = currentRoute();
  $('#sidebarNav').innerHTML = navHTML(id, false);
  $('#tabbarNav').innerHTML = navHTML(id, true);
}

let LAST_ROUTE_KEY = null;
function render(){
  const { id, args } = currentRoute();
  const routeKey = id + '|' + args.join('/');
  const isNewRoute = routeKey !== LAST_ROUTE_KEY;
  LAST_ROUTE_KEY = routeKey;

  // Preserve focus + cursor position across the innerHTML rebuild below, so
  // typing in a search box doesn't dismiss the on-screen keyboard on every
  // keystroke (the old behaviour: re-render destroyed and recreated the
  // input element each time, which blurs it).
  const active = document.activeElement;
  const activeId = active && active.id;
  const canRestore = !!(activeId && active.tagName && (active.tagName==='INPUT' || active.tagName==='TEXTAREA'));
  const selStart = canRestore && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = canRestore && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  renderShell();
  const main = $('#main');
  const renderers = {
    dashboard: renderDashboard,
    collection: renderCollection,
    pokedex: args[0] ? renderSpeciesDetail : renderPokedex,
    taxonomy: renderTaxonomy,
    evolutions: renderEvolutions,
    binder: renderBinder,
    extras: renderExtras,
    import: renderImport,
    history: renderHistory,
    settings: renderSettings,
  };
  const fn = renderers[id] || renderDashboard;
  main.innerHTML = fn(args);
  if(isNewRoute) main.scrollTop = 0;
  wireScreenEvents(id, args);

  if(canRestore){
    const el = document.getElementById(activeId);
    if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
      el.focus({preventScroll:true});
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

let collectionFilter = { q:'', group:'', pickOnly:false, sort:'name' };
let evolutionsFilter = { q:'' };

function renderCollection(){
  const groups = Array.from(new Set(SPECIES.map(s=>s.group))).sort();
  let rows = STATE.collection.slice();

  if(collectionFilter.q){
    const q = norm(collectionFilter.q);
    rows = rows.filter(c => norm(c.species||c.productName).includes(q) || norm(c.set).includes(q) || norm(c.productName).includes(q) || norm(c.cardNumber).includes(q));
  }
  if(collectionFilter.group){
    rows = rows.filter(c => c.species && speciesByName.get(c.species)?.group === collectionFilter.group);
  }
  if(collectionFilter.pickOnly){
    rows = rows.filter(c => c.species && STATE.picks[c.species] === c.id);
  }
  const sorters = {
    name: (a,b) => (a.species||a.productName).localeCompare(b.species||b.productName),
    value: (a,b) => (b.marketPrice*b.quantity) - (a.marketPrice*a.quantity),
    recent: (a,b) => new Date(b.dateAdded) - new Date(a.dateAdded),
    qty: (a,b) => b.quantity - a.quantity,
  };
  rows.sort(sorters[collectionFilter.sort] || sorters.name);

  const s = collectionStats();

  return `
    <div class="pagehead">
      <div><h1>Collection</h1><div class="sub">${fmtInt(STATE.collection.length)} card entries · ${fmtInt(s.totalCards)} total cards · ${fmtMoney(s.totalValue)}</div></div>
      <a href="#/import" class="btn primary" data-nav="import">${ICONS.upload} Import</a>
    </div>

    <div class="toolbar">
      <div class="searchbar">${ICONS.search}<input type="search" id="colSearch" placeholder="Search cards, species, sets, numbers…" value="${esc(collectionFilter.q)}"></div>
      <select id="colGroup">
        <option value="">All groups</option>
        ${groups.map(g=>`<option value="${esc(g)}" ${collectionFilter.group===g?'selected':''}>${esc(g)}</option>`).join('')}
      </select>
      <select id="colSort">
        <option value="name" ${collectionFilter.sort==='name'?'selected':''}>Sort: Name</option>
        <option value="value" ${collectionFilter.sort==='value'?'selected':''}>Sort: Value</option>
        <option value="recent" ${collectionFilter.sort==='recent'?'selected':''}>Sort: Recently added</option>
        <option value="qty" ${collectionFilter.sort==='qty'?'selected':''}>Sort: Quantity</option>
      </select>
      <button class="chip ${collectionFilter.pickOnly?'active':''}" id="colPickOnly">${ICONS.star} Binder picks only</button>
    </div>

    ${rows.length===0 ? `<div class="emptystate card">${ICONS.empty}<h3>No matching cards</h3><p>${STATE.collection.length===0 ? 'Import your Collectr export to add cards.' : 'Try adjusting your filters.'}</p></div>` : `
    <div class="cardlist">
      ${rows.map(c => renderCardRow(c)).join('')}

  `;
}

function openCardEditor(cardId){
  const c = STATE.collection.find(x=>x.id===cardId);
  if(!c) return;
  openModal(`Edit card`, `
    <div class="field"><label>Species</label>
      ${speciesPickerHTML({ id:'edSpecies', current:c.species, placeholder:'Type to search species…' })}
    </div>
    <div class="row2">
      <div class="field"><label>Quantity</label><input type="number" min="0" id="edQty" value="${c.quantity}"></div>
      <div class="field"><label>Condition</label><input type="text" id="edCond" value="${esc(c.condition)}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Cost paid ($)</label><input type="number" step="0.01" min="0" id="edCost" value="${c.costPaid}"></div>
      <div class="field"><label>Market price ($)</label><input type="number" step="0.01" min="0" id="edMkt" value="${c.marketPrice}"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="edNotes" rows="2">${esc(c.notes)}</textarea></div>
  `, `
    <button class="btn ghost" data-action="close-modal">Cancel</button>
    <button class="btn primary" id="saveCardBtn">Save changes</button>
  `);
  wireSpeciesPickers();
  $('#saveCardBtn').addEventListener('click', () => {
    const newSpecies = $('#edSpecies').value || null;
    const oldSpecies = c.species;
    c.species = newSpecies;
    c.quantity = Math.max(0, parseInt($('#edQty').value,10)||0);
    c.condition = $('#edCond').value;
    c.costPaid = parseFloat($('#edCost').value)||0;
    c.marketPrice = parseFloat($('#edMkt').value)||0;
    c.notes = $('#edNotes').value;
    if(oldSpecies !== newSpecies && STATE.picks[oldSpecies] === c.id){ delete STATE.picks[oldSpecies]; persist('picks'); }
    // Teach the importer this raw product name maps to the chosen species, the
    // same way a manual match during import does. Without this, re-importing
    // the same Collectr CSV later (e.g. because market price changed) rebuilds
    // this exact card from scratch via resolveSpecies(productName) and silently
    // reverts a manual variant correction like "Meowth" -> "Galarian Meowth".
    if(newSpecies && c.productName){
      STATE.overrides[norm(c.productName)] = newSpecies;
      persist('overrides');
    }
    persist('collection');
    closeModal();
    toast('Card updated.');
    render();
  });
}

function toggleBinderPick(cardId, speciesName){
  if(STATE.picks[speciesName] === cardId){
    delete STATE.picks[speciesName];
    toast('Binder pick removed.');
  } else {
    const prevId = STATE.picks[speciesName];
    STATE.picks[speciesName] = cardId;
    toast(prevId ? 'Binder pick replaced.' : 'Binder pick set.');
  }
  persist('picks');
  render();
}

function deleteCard(cardId){
  const c = STATE.collection.find(x=>x.id===cardId);
  if(!c) return;
  confirmAction(`Remove "${c.species||c.productName}" (${c.set} #${c.cardNumber}) from your collection?`, () => {
    STATE.collection = STATE.collection.filter(x=>x.id!==cardId);
    if(c.species && STATE.picks[c.species]===cardId) delete STATE.picks[c.species];
    persist('collection'); persist('picks');
    toast('Card removed.');
    render();
  });
}

let pokedexFilter = { q:'', group:'', status:'', sort:'dex', type:'' };
let pokedexSelectMode = false;
let pokedexSelection = [];

const ALL_TYPES = ['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];
const TYPE_COLORS = {
  Normal:'#a8a878', Fire:'#f08030', Water:'#6890f0', Electric:'#f8d030', Grass:'#78c850', Ice:'#98d8d8',
  Fighting:'#c03028', Poison:'#a040a0', Ground:'#e0c068', Flying:'#a890f0', Psychic:'#f85888', Bug:'#a8b820',
  Rock:'#b8a038', Ghost:'#705898', Dragon:'#7038f8', Dark:'#705848', Steel:'#b8b8d0', Fairy:'#ee99ac'
};
function typeBadges(types){
  return (types||[]).map(t=>`<span class="type-badge" style="background:${TYPE_COLORS[t]||'#999'}">${esc(t)}</span>`).join('');
}
const TYPE_ABBR = {
  Normal:'NOR', Fire:'FIR', Water:'WAT', Electric:'ELE', Grass:'GRA', Ice:'ICE',
  Fighting:'FIG', Poison:'POI', Ground:'GRD', Flying:'FLY', Psychic:'PSY', Bug:'BUG',
  Rock:'ROC', Ghost:'GHO', Dragon:'DRA', Dark:'DAK', Steel:'STE', Fairy:'FAI'
};
// Compact colored symbol(s) for a species' type(s) — used on binder pockets where
// full typeBadges() text pills would be too wide.
function typeDots(types){
  return (types||[]).map(t=>`<span class="typedot" style="background:${TYPE_COLORS[t]||'#999'}" title="${esc(t)}">${TYPE_ABBR[t]||esc(t).slice(0,3).toUpperCase()}</span>`).join('');
}
// Name of the species this one evolves from (same evolution family, one stage
// earlier). When more than one prior-stage candidate exists (e.g. a species
// has both a base-form and a regional-form predecessor), prefer an exact
// variant-tag match; otherwise fall back to whichever candidate shares the
// most types, since the real lineage usually keeps at least one type in
// common (this correctly resolves cases like Overqwil, which isn't tagged
// as a variant itself but continues from the Hisuian Qwilfish line).
function evolvesFrom(s){
  if(!s || !s.evoFamily || !s.evoOrder || s.evoOrder<=1) return null;
  const prior = SPECIES.filter(x => x.evoFamily===s.evoFamily && x.evoOrder===s.evoOrder-1);
  if(!prior.length) return null;
  if(prior.length===1) return prior[0].name;
  // A parenthetical suffix on the name — e.g. "(Orange Flower)", "(Summer)",
  // "(Female)" — usually marks a cosmetic variant that should match the same
  // suffix on its prior stage (Florges (Orange Flower) <- Floette (Orange
  // Flower), not whichever color happens to come first in the list).
  const suffix = (s.name.match(/\(([^)]+)\)\s*$/)||[])[1];
  if(suffix){
    const sameSuffix = prior.find(x => x.name.includes(`(${suffix})`));
    if(sameSuffix) return sameSuffix.name;
  }
  if(s.variant){
    const sameVariant = prior.find(x => x.variant===s.variant);
    if(sameVariant) return sameVariant.name;
  }
  // Gender-branching families (evoFamily names both ♀ and ♂ starters, e.g.
  // "Nidoran♀/Nidoran♂") have no type or variant signal at all to tell the
  // two parallel lines apart — but each line's stages sit next to each other
  // in dex/array order, so the nearest candidate by array position is the
  // right one (fixes Nidorino/Nidoking otherwise defaulting to the ♀ line).
  if(s.evoFamily && s.evoFamily.includes('♀') && s.evoFamily.includes('♂')){
    const idx = SPECIES.indexOf(s);
    return prior.slice().sort((a,b)=>Math.abs(SPECIES.indexOf(a)-idx)-Math.abs(SPECIES.indexOf(b)-idx))[0].name;
  }
  const overlap = x => (x.types||[]).filter(t => (s.types||[]).includes(t)).length;
  return prior.slice().sort((a,b)=>overlap(b)-overlap(a))[0].name;
}
function renderPokedex(){
  const groups = Array.from(new Set(SPECIES.map(s=>s.group))).sort();
  let list = SPECIES.slice();

  if(pokedexFilter.q){
    const q = norm(pokedexFilter.q);
    list = list.filter(s => norm(s.name).includes(q) || norm(s.evoFamily).includes(q) || (s.types||[]).some(t=>norm(t)===q));
  }
  if(pokedexFilter.group) list = list.filter(s => s.group === pokedexFilter.group);
  if(pokedexFilter.type) list = list.filter(s => (s.types||[]).includes(pokedexFilter.type));
  if(pokedexFilter.status === 'owned') list = list.filter(s => isOwned(s.name));
  if(pokedexFilter.status === 'missing') list = list.filter(s => !isOwned(s.name));
  if(pokedexFilter.status === 'pick') list = list.filter(s => !!STATE.picks[s.name]);
  if(pokedexFilter.status === 'needpick') list = list.filter(s => speciesOwnedQty(s.name) > 0 && !STATE.picks[s.name]);

  if(pokedexFilter.sort === 'dex') list.sort((a,b)=> (a.dex??99999) - (b.dex??99999));
  else if(pokedexFilter.sort === 'name') list.sort((a,b)=>a.name.localeCompare(b.name));

  return `
    <div class="pagehead">
      <div><h1>Pokédex</h1><div class="sub">${fmtInt(SPECIES.length)} species · the master reference</div></div>
      <button class="btn ${pokedexSelectMode?'accent':''}" data-action="toggle-pdx-select-mode">${pokedexSelectMode?'Done selecting':'Select multiple'}</button>
    </div>
    ${pokedexSelectMode ? `
    <div class="binder-edit-toolbar">
      <div class="hint">Tap Pokémon to select them, then recategorize or mark the whole batch owned at once.</div>
      <div class="btns">
        <button class="btn ${pokedexSelection.length?'accent':''}" data-action="open-bulk-recategorize" ${pokedexSelection.length?'':'disabled'}>Recategorize selected (${pokedexSelection.length})</button>
        <button class="btn ${pokedexSelection.length?'accent':''}" data-action="bulk-mark-owned" ${pokedexSelection.length?'':'disabled'}>Mark selected as owned (${pokedexSelection.length})</button>
      </div>
    </div>` : ''}
    <div class="toolbar">
      <div class="searchbar">${ICONS.search}<input type="search" id="pdxSearch" placeholder="Search species…" value="${esc(pokedexFilter.q)}"></div>
      <select id="pdxGroup"><option value="">All groups</option>${groups.map(g=>`<option value="${esc(g)}" ${pokedexFilter.group===g?'selected':''}>${esc(g)}</option>`).join('')}</select>
      <select id="pdxType"><option value="">All types</option>${ALL_TYPES.map(t=>`<option value="${esc(t)}" ${pokedexFilter.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
      <select id="pdxStatus">
        <option value="" ${pokedexFilter.status===''?'selected':''}>All</option>
        <option value="owned" ${pokedexFilter.status==='owned'?'selected':''}>Owned</option>
        <option value="missing" ${pokedexFilter.status==='missing'?'selected':''}>Missing</option>
        <option value="pick" ${pokedexFilter.status==='pick'?'selected':''}>Has binder pick</option>
        <option value="needpick" ${pokedexFilter.status==='needpick'?'selected':''}>Owned, needs pick</option>
      </select>
      <select id="pdxSort">
        <option value="dex" ${pokedexFilter.sort==='dex'?'selected':''}>Sort: Dex #</option>
        <option value="name" ${pokedexFilter.sort==='name'?'selected':''}>Sort: Name</option>
      </select>
    </div>
    <div class="grid-species">
      ${list.map(s => renderSpeciesCard(s, pokedexSelectMode, pokedexSelection.includes(s.name))).join('')}
    </div>
  `;
}

      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${famMembers.map(m => `<span class="chip ${m.name===s.name?'active':''}" ${m.name!==s.name?`data-nav-species="${esc(m.name)}"`:''}>${esc(m.name)}${isOwned(m.name)?' ✓':''}</span>`).join('')}

    ${cards.length===0 ? `<div class="emptystate card">${ICONS.empty}<h3>Not in your collection</h3><p>Import your Collectr export to add ${esc(s.name)}.</p></div>` :
    `<div class="cardlist">${cards.map(c => `
      <div class="cardrow">
        <div class="info">
          <div style="font-weight:600;">${esc(c.set)} · #${esc(c.cardNumber)}</div>
          <div class="set">${esc(c.rarity)}${c.variance?' · '+esc(c.variance):''} · ${esc(c.condition)}</div>
          <div class="meta">Qty ${c.quantity} · Added ${esc(c.dateAdded)}</div>
        </div>
        <div class="val">${fmtMoney(c.marketPrice*c.quantity)}</div>
        <button class="starbtn ${pickId===c.id?'active':''}" data-action="toggle-pick" data-card="${c.id}" data-species="${esc(name)}">${pickId===c.id?ICONS.star:ICONS.starOutline} ${pickId===c.id?'Binder pick':'Set as pick'}</button>
      </div>`).join('')}</div>`}

}

/* ============================================================
   Taxonomy browser (drill-down: group -> category -> subcategory -> species)
   ============================================================ */
function taxLevelKey(level){ return ['group','category','subcategory'][level]; }

function renderTaxonomy(args){
  const path = args.map(a=>decodeURIComponent(a)).filter(a=>a && a!=='—');
  const level = path.length; // 0=groups,1=categories,2=subcategories,3=species list

  const crumbs = `<div class="crumbs"><span class="c" data-nav="taxonomy">Taxonomy</span>` +
    path.map((p,i)=>` <span>›</span> <span class="c" data-nav-taxonomy="${path.slice(0,i+1).map(encodeURIComponent).join('/')}">${esc(p)}</span>`).join('') + `</div>`;

  if(level >= 3 || (level>0 && !hasDeeperLevel(path))){
    // species list at this taxonomy node
    const filtered = SPECIES.filter(s => matchesPath(s, path));
    const owned = filtered.filter(s=>isOwned(s.name)).length;
    return `
      ${crumbs}
      <div class="pagehead"><h1>${esc(path[path.length-1] || 'All species')}</h1></div>
      <div class="panel" style="margin-bottom:18px;display:flex;gap:24px;flex-wrap:wrap;">
        <div><div class="num" style="font-family:var(--font-display);font-size:20px;">${owned} / ${filtered.length}</div><div class="label" style="font-size:11px;color:var(--ink-soft);">species owned</div></div>
        <div><div class="num" style="font-family:var(--font-display);font-size:20px;">${fmtPct(filtered.length?owned/filtered.length*100:0)}</div><div class="label" style="font-size:11px;color:var(--ink-soft);">completion</div></div>
      </div>
      <div class="grid-species">${filtered.sort((a,b)=>(a.dex??99999)-(b.dex??99999)).map(renderSpeciesCard).join('')}</div>
    `;
  }

  // group/category/subcategory listing
  const key = taxLevelKey(level);
  const children = Array.from(new Set(SPECIES.filter(s=>matchesPath(s,path)).map(s=>s[key]))).filter(v=>v).sort();
  return `
    ${crumbs}
    <div class="pagehead"><h1>${level===0?'Taxonomy':esc(path[path.length-1])}</h1><div class="sub">${level===0?'Browse the collection by taxonomy':'Drill down'}</div></div>
    <div class="taxlist">
      ${children.map(childVal => {
        const childPath = [...path, childVal];
        const inGroup = SPECIES.filter(s=>matchesPath(s,childPath));
        const owned = inGroup.filter(s=>isOwned(s.name)).length;
        const pct = inGroup.length ? owned/inGroup.length*100 : 0;
        return `
        <div class="taxrow" data-nav-taxonomy="${childPath.map(encodeURIComponent).join('/')}">
          <div class="nm">${esc(childVal)}</div>
          <div class="stats">
            <span>${owned} / ${inGroup.length}</span>
            <span class="barbg"><span class="barfg" style="width:${pct}%;"></span></span>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}
function matchesPath(s, path){
  const keys = ['group','category','subcategory'];
  return path.every((p,i) => s[keys[i]] === p);
}
function hasDeeperLevel(path){
  const key = taxLevelKey(path.length);
  if(!key) return false;
  return SPECIES.some(s => matchesPath(s,path) && s[key] && s[key] !== '—');
}

/* ============================================================
   Binder
   ============================================================ */
let binderPage = 1;
let binderEditMode = false;
let mergeSelection = [];
let labelUndoStack = [];
let labelRedoStack = [];

function snapshotLabels(){ return JSON.stringify({ o: STATE.labelOverrides, m: STATE.mergedLabels }); }
function pushLabelUndo(){
  labelUndoStack.push(snapshotLabels());
  if(labelUndoStack.length > 50) labelUndoStack.shift();
  labelRedoStack = [];
}
function undoLabels(){
  if(!labelUndoStack.length){ toast('Nothing to undo.'); return; }
  labelRedoStack.push(snapshotLabels());
  const prev = JSON.parse(labelUndoStack.pop());
  STATE.labelOverrides = prev.o; STATE.mergedLabels = prev.m;
  persist('labelOverrides'); persist('mergedLabels');
  toast('Undone.'); render();
}
function redoLabels(){
  if(!labelRedoStack.length){ toast('Nothing to redo.'); return; }
  labelUndoStack.push(snapshotLabels());
  const next = JSON.parse(labelRedoStack.pop());
  STATE.labelOverrides = next.o; STATE.mergedLabels = next.m;
  persist('labelOverrides'); persist('mergedLabels');
  toast('Redone.'); render();
}
function toggleBinderEditMode(){
  binderEditMode = !binderEditMode;
  mergeSelection = [];
  render();
}
function toggleMergeSelect(slotStr){
  const idx = mergeSelection.indexOf(slotStr);
  if(idx>=0) mergeSelection.splice(idx,1); else mergeSelection.push(slotStr);
  render();
}
function openLabelEditor(slotStr){
  const key = slotStr;
  const item = BINDER.find(b=>b.key===key);
  if(!item) return;
  const isCategoryLevel = item.labelLevel === 'CATEGORY' || item.labelLevel === 'SUBCATEGORY';
  const current = STATE.labelOverrides[key] || item.display;
  openModal('Edit label', `
    <div class="field">
      <label>Label text</label>
      <input type="text" id="labelEditInput" value="${esc(current)}" maxlength="60">
    </div>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:8px;">Page ${item.page}, pocket ${item.pocket} · ${esc(item.labelLevel||'')}${isCategoryLevel ? ' — this renames it everywhere, including in Settings' : ''}</p>
  `, `
    <button class="btn ghost" data-action="close-modal">Cancel</button>
    ${(!isCategoryLevel && STATE.labelOverrides[key]) ? `<button class="btn ghost" id="labelResetBtn">Reset to original</button>` : ''}
    <button class="btn accent" id="labelSaveBtn">Save</button>
  `);
  $('#labelSaveBtn').addEventListener('click', () => {
    const val = ($('#labelEditInput').value||'').trim();
    if(!val){ toast("Label can't be empty."); return; }
    // CATEGORY/SUBCATEGORY pockets are renamed for real (same code path as the
    // Settings taxonomy manager) instead of getting a cosmetic-only overlay —
    // otherwise the binder and Settings can end up showing two different names
    // for what's supposed to be the same category.
    if(item.labelLevel === 'CATEGORY'){
      if(val === item.category){ closeModal(); return; }
      if(doRenameCategory(item.group, item.category, val)){ closeModal(); toast('Category renamed.'); render(); }
      return;
    }
    if(item.labelLevel === 'SUBCATEGORY'){
      if(val === item.subcategory){ closeModal(); return; }
      if(doRenameSubcategory(item.category, item.subcategory, val)){ closeModal(); toast('Subcategory renamed.'); render(); }
      return;
    }
    pushLabelUndo();
    if(val === item.display) delete STATE.labelOverrides[key];
    else STATE.labelOverrides[key] = val;
    persist('labelOverrides');
    closeModal(); toast('Label updated.'); render();
  });
  $('#labelResetBtn')?.addEventListener('click', () => {
    pushLabelUndo();
    delete STATE.labelOverrides[key];
    persist('labelOverrides');
    closeModal(); toast('Reset to original text.'); render();
  });
}
function openUnmergeModal(slotStr){
  const key = slotStr;
  const item = BINDER.find(b=>b.key===key);
  const targetKey = STATE.mergedLabels[key];
  const target = BINDER.find(b=>b.key===targetKey);
  if(!item || !target) return;
  openModal('Merged label', `<p>"${esc(item.display)}" is currently combined into the label on page ${target.page}, pocket ${target.pocket} ("${esc(STATE.labelOverrides[targetKey] || target.display)}"). Restore it as its own label?</p>`,
    `<button class="btn ghost" data-action="close-modal">Cancel</button>
     <button class="btn accent" id="unmergeBtn">Restore</button>`);
  $('#unmergeBtn').addEventListener('click', () => {
    pushLabelUndo();
    delete STATE.mergedLabels[key];
    persist('mergedLabels');
    closeModal(); toast('Restored as its own label.'); render();
  });
}
function combineSelectedLabels(){
  if(mergeSelection.length < 2){ toast('Select at least two labels to combine.'); return; }
  const items = mergeSelection.map(k=>BINDER.find(b=>b.key===k)).filter(Boolean);
  const level = items[0].labelLevel;
  if(items.some(it=>it.labelLevel!==level)){ toast('You can only combine labels of the same level — e.g. two categories, or two subcategories.'); return; }
  items.sort((a,b)=>a.slot-b.slot);
  const target = items[0];
  const rest = items.slice(1);
  pushLabelUndo();
  const texts = items.map(it => STATE.labelOverrides[it.key] || it.display);
  STATE.labelOverrides[target.key] = texts.join(' & ');
  rest.forEach(it => { STATE.mergedLabels[it.key] = target.key; delete STATE.labelOverrides[it.key]; });
  persist('labelOverrides'); persist('mergedLabels');
  mergeSelection = [];
  toast('Combined — tap the label to rename it.');
  render();
}

/* ============================================================
   Taxonomy management — add, rename, or remove the categories and
   subcategories used to sort the binder. Saved to STATE.taxonomy so
   it survives reloads and travels with backup export/restore.

function saveTaxonomy(){
  STATE.taxonomy = { groups: GROUP_ORDER, categories: CATEGORY_ORDER, subcategories: SUBCATEGORY_ORDER };
  persist('taxonomy');
}
function promptTextModal(title, label, initialValue, onSave){
  openModal(title, `
    <div class="field">

function addCategoryToGroup(group){
  promptTextModal('Add category', `New category under "${group}"`, '', name => {
    if((CATEGORY_ORDER[group]||[]).some(c=>c.toLowerCase()===name.toLowerCase())){ toast('That category already exists in this group.'); return; }
    if(!CATEGORY_ORDER[group]) CATEGORY_ORDER[group] = [];
    CATEGORY_ORDER[group].push(name);
    // every category needs at least one subcategory so the recategorize
    // menu always has something to select — using the category's own name
    // means "no real subdivision" without a blank/broken dropdown.
    if(!SUBCATEGORY_ORDER[name] || !SUBCATEGORY_ORDER[name].length) SUBCATEGORY_ORDER[name] = [name];
    saveTaxonomy();
    closeModal(); toast(`"${name}" added.`); render();
  });
}
/* Core rename logic, usable both from the Settings taxonomy manager (via
   renameCategory below) and directly from the binder's "Edit label" flow on a
   CATEGORY pocket, so both places share one source of truth and can never
   drift apart (a category's real name always matches what the binder shows). */
function doRenameCategory(group, oldName, newName){
  if(newName === oldName) return true;
  if((CATEGORY_ORDER[group]||[]).some(c=>c.toLowerCase()===newName.toLowerCase())){ toast('That name is already used in this group.'); return false; }
  CATEGORY_ORDER[group] = (CATEGORY_ORDER[group]||[]).map(c => c===oldName ? newName : c);
  if(SUBCATEGORY_ORDER[oldName]){ SUBCATEGORY_ORDER[newName] = SUBCATEGORY_ORDER[oldName]; delete SUBCATEGORY_ORDER[oldName]; }
  let touched = false;
  SPECIES.forEach(s => {
    if(s.category === oldName){
      s.category = newName; touched = true;
      STATE.categoryOverrides[s.name] = { group: s.group, category: s.category, subcategory: s.subcategory };
    }
  });
  if(touched) persist('categoryOverrides');
  const oldKey = 'CATEGORY::'+oldName, newKey = 'CATEGORY::'+newName;
  if(STATE.labelOverrides[oldKey] !== undefined){ STATE.labelOverrides[newKey] = STATE.labelOverrides[oldKey]; delete STATE.labelOverrides[oldKey]; persist('labelOverrides'); }
  saveTaxonomy();
  rebuildBinder();
  return true;
}
function renameCategory(group, oldName){
  promptTextModal('Rename category', 'Category name', oldName, newName => {
    if(newName === oldName){ closeModal(); return; }
    if(doRenameCategory(group, oldName, newName)){ closeModal(); toast('Category renamed.'); render(); }
  });
}
function deleteCategory(group, name){
  const inUse = SPECIES.some(s => s.category === name);
  if(inUse){ toast('Recategorize the Pokémon using this category before deleting it.'); return; }
  confirmAction(`Delete the category "${name}" and its subcategories? This can't be undone.`, () => {
    CATEGORY_ORDER[group] = (CATEGORY_ORDER[group]||[]).filter(c=>c!==name);
    delete SUBCATEGORY_ORDER[name];
    saveTaxonomy();
    rebuildBinder();
    toast('Category deleted.'); render();
  });
}
function addSubcategory(category){
  promptTextModal('Add subcategory', `New subcategory under "${category}"`, '', name => {
    if(!SUBCATEGORY_ORDER[category]) SUBCATEGORY_ORDER[category] = [];
    if(SUBCATEGORY_ORDER[category].some(s=>s.toLowerCase()===name.toLowerCase())){ toast('That subcategory already exists.'); return; }
    SUBCATEGORY_ORDER[category].push(name);
    SUBCATEGORY_ORDER[category].sort((a,b)=>a.localeCompare(b));
    saveTaxonomy();
    closeModal(); toast(`"${name}" added.`); render();
  });
}
function doRenameSubcategory(category, oldName, newName){
  if(newName === oldName) return true;
  if((SUBCATEGORY_ORDER[category]||[]).some(s=>s.toLowerCase()===newName.toLowerCase())){ toast('That name is already used in this category.'); return false; }
  SUBCATEGORY_ORDER[category] = (SUBCATEGORY_ORDER[category]||[]).map(s => s===oldName ? newName : s);
  let touched = false;
  SPECIES.forEach(s => {
    if(s.category===category && s.subcategory === oldName){
      s.subcategory = newName; touched = true;
      STATE.categoryOverrides[s.name] = { group: s.group, category: s.category, subcategory: s.subcategory };
    }
  });
  if(touched) persist('categoryOverrides');
  const oldKey = 'SUBCATEGORY::'+oldName, newKey = 'SUBCATEGORY::'+newName;
  if(STATE.labelOverrides[oldKey] !== undefined){ STATE.labelOverrides[newKey] = STATE.labelOverrides[oldKey]; delete STATE.labelOverrides[oldKey]; persist('labelOverrides'); }
  saveTaxonomy();
  rebuildBinder();
  return true;
}
function renameSubcategory(category, oldName){
  promptTextModal('Rename subcategory', 'Subcategory name', oldName, newName => {
    if(newName === oldName){ closeModal(); return; }
    if(doRenameSubcategory(category, oldName, newName)){ closeModal(); toast('Subcategory renamed.'); render(); }
  });
}
function deleteSubcategory(category, name){
  const inUse = SPECIES.some(s => s.category===category && s.subcategory === name);
  if(inUse){ toast('Recategorize the Pokémon using this subcategory before deleting it.'); return; }
  confirmAction(`Delete the subcategory "${name}"? This can't be undone.`, () => {
    SUBCATEGORY_ORDER[category] = (SUBCATEGORY_ORDER[category]||[]).filter(s=>s!==name);
    saveTaxonomy();
    rebuildBinder();
    toast('Subcategory deleted.'); render();
  });
}
