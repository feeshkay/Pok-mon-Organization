/* ============================================================
   Recategorize — change a species' (or several species') taxonomy
   placement by hand; the physical binder reflows automatically.
   ============================================================ */
function openRecategorizeModal(names){
  const specs = (names||[]).map(n=>speciesByName.get(n)).filter(Boolean);
  if(!specs.length) return;
  const common = field => { const vals = new Set(specs.map(s=>s[field])); return vals.size===1 ? [...vals][0] : ''; };
  const state = { group: common('group'), category: common('category'), subcategory: common('subcategory') };

  function body(){
    const cats = CATEGORY_ORDER[state.group] || [];
    if(!cats.includes(state.category)) state.category = '';
    const subs = state.category ? (SUBCATEGORY_ORDER[state.category] || [state.category]) : [];
    if(!subs.includes(state.subcategory)) state.subcategory = '';
    return `
      <div class="field"><label>Group</label>
        <select id="rcGroup">
          <option value="">— choose —</option>
          ${GROUP_ORDER.map(x=>`<option value="${esc(x)}" ${state.group===x?'selected':''}>${esc(x)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Category</label>
        <select id="rcCategory" ${!state.group?'disabled':''}>
          <option value="">— choose —</option>
          ${cats.map(x=>`<option value="${esc(x)}" ${state.category===x?'selected':''}>${esc(x)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Subcategory</label>
        <select id="rcSubcategory" ${!state.category?'disabled':''}>
          <option value="">— choose —</option>
          ${subs.map(x=>`<option value="${esc(x)}" ${state.subcategory===x?'selected':''}>${esc(x)}</option>`).join('')}
        </select>
      </div>
      <p style="font-size:12px;color:var(--ink-soft);margin-top:8px;">${specs.length===1 ? esc(specs[0].name) : specs.length+' Pokémon selected — this moves all of them together.'}</p>
    `;
  }
  function paint(){ $('#rcBody').innerHTML = body(); wire(); }
  function wire(){
    $('#rcGroup')?.addEventListener('change', e => { state.group = e.target.value; state.category=''; state.subcategory=''; paint(); });
    $('#rcCategory')?.addEventListener('change', e => { state.category = e.target.value; state.subcategory=''; paint(); });
    $('#rcSubcategory')?.addEventListener('change', e => { state.subcategory = e.target.value; });
  }

  openModal('Recategorize', `<div id="rcBody">${body()}</div>`,
    `<button class="btn ghost" data-action="close-modal">Cancel</button>
     <button class="btn accent" id="rcSaveBtn">Save & reflow binder</button>`);
  wire();
  function commit(extraSpecs){
    const ov = { group: state.group, category: state.category, subcategory: state.subcategory };
    const all = extraSpecs ? specs.concat(extraSpecs) : specs;
    all.forEach(sp => { Object.assign(sp, ov); STATE.categoryOverrides[sp.name] = ov; });
    persist('categoryOverrides');
    rebuildBinder();
    closeModal();
    toast(all.length===1 ? `${all[0].name} recategorized.` : `${all.length} Pokémon recategorized.`);
    pokedexSelectMode = false; pokedexSelection = [];
    render();
  }
  $('#rcSaveBtn').addEventListener('click', () => {
    if(!state.group || !state.category || !state.subcategory){ toast('Choose a group, category, and subcategory.'); return; }
    // If any selected Pokémon belongs to an evolution family, offer to move
    // the rest of that family along with it, so you don't have to repeat
    // this for every stage by hand.
    const selectedNames = new Set(specs.map(s=>s.name));
    const familyNames = new Set(specs.map(s=>s.evoFamily).filter(Boolean));
    const restOfFamily = SPECIES.filter(s => familyNames.has(s.evoFamily) && !selectedNames.has(s.name));
    if(restOfFamily.length){
      const listText = restOfFamily.map(s=>s.name).join(', ');
      openModal('Update the whole family too?', `
        <p>${specs.length===1 ? esc(specs[0].name) : 'These Pokémon'} ${specs.length===1?'is':'are'} part of an evolution family. Move the rest of the family (${esc(listText)}) to the same category too?</p>
      `, `
        <button class="btn ghost" id="rcFamilyNoBtn">Just this one</button>
        <button class="btn accent" id="rcFamilyYesBtn">Move the whole family</button>
      `);
      $('#rcFamilyYesBtn').addEventListener('click', () => commit(restOfFamily));
      $('#rcFamilyNoBtn').addEventListener('click', () => commit());
      return;
    }
    commit();
  });
}

function evoNodeHTML(m){

  return `<button class="evofam-node ${owned?'owned':'missing'}" data-nav-species="${esc(m.name)}">
    <div class="evofam-thumb">${speciesImgTag(m,'evofam-img')}</div>
    <div class="evofam-nm">${esc(m.name)}${qty>0?` <span class="evofam-qty">×${qty}</span>`:''}</div>

/* ---------------- Edit evolution family membership ----------------
   Lets you fix a mismatched family (two forms that should be one line
   but aren't linking up), add a member, remove one, or change a
   member's stage. Saved to STATE.familyOverrides so it survives
   reloads and reimports the same way category edits do. */
function familyMembers(famName){
  return SPECIES.filter(s => s.evoFamily === famName).sort((a,b)=>(a.evoOrder||0)-(b.evoOrder||0) || ((a.dex??99999)-(b.dex??99999)));
}
function saveFamilyEdit(sp){
  STATE.familyOverrides[sp.name] = { evoFamily: sp.evoFamily, evoOrder: sp.evoOrder };
  persist('familyOverrides');
  rebuildBinder();
}

function removeFamilyMember(name, famName){

function renderEvolutions(){
  const familiesMap = new Map();
  SPECIES.forEach(s => {
    if(!familiesMap.has(s.evoFamily)) familiesMap.set(s.evoFamily, []);
    familiesMap.get(s.evoFamily).push(s);
  });
  let families = [...familiesMap.entries()].map(([fam, members]) => {
    members = members.slice().sort((a,b)=>(a.evoOrder||0)-(b.evoOrder||0) || ((a.dex??99999)-(b.dex??99999)));
    return { fam, members };
  });
  families.sort((a,b) => (a.members[0].dex??99999) - (b.members[0].dex??99999));

  const q = evolutionsFilter.q ? norm(evolutionsFilter.q) : '';
  const filtered = q ? families.filter(f => f.members.some(m=>norm(m.name).includes(q))) : families;

  const cards = filtered.map(f => {
    const orders = [...new Set(f.members.map(m=>m.evoOrder||1))].sort((a,b)=>a-b);
    const stageGroups = orders.map(o => f.members.filter(m=>(m.evoOrder||1)===o));
    const stagesHTML = stageGroups.map((group, gi) => `
      ${gi>0 ? `<span class="evo-arrow">${ICONS.right}</span>` : ''}
      <div class="evofam-stage">${group.map(evoNodeHTML).join('')}</div>
    `).join('');
    return `<div class="evofam-card">
      <div class="evofam-chain">${stagesHTML}</div>
      <div style="margin-top:8px;text-align:right;">
        <button class="btn ghost sm" data-action="edit-family" data-fam="${esc(f.fam)}">${ICONS.edit} Edit family</button>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="pagehead">
      <div><h1>Evolutions</h1><div class="sub">${fmtInt(families.length)} evolution families · every Pokémon, grouped with what it evolves into or from</div></div>
    </div>

      <div class="searchbar">${ICONS.search}<input type="search" id="evoSearch" placeholder="Filter by name…" value="${esc(evolutionsFilter.q)}" autocomplete="off"></div>

  `;

/* ============================================================
   Extras Binder — a second binder for every copy beyond each
   species' main-binder pick (duplicates, and any card for a
   species that isn't the chosen pick). Derived on the fly from
   the collection + picks, grouped and ordered the same way the
   main binder's taxonomy is, and auto-paginated 3×3 per page.
   ============================================================ */
function extrasBySpecies(){
  const map = new Map(); // speciesName -> extra copy count
  STATE.collection.forEach(c => {
    if(!c.species) return;
    const isPick = STATE.picks[c.species] === c.id;
    const extra = isPick ? Math.max(0, (c.quantity||0) - 1) : (c.quantity||0);
    if(extra > 0) map.set(c.species, (map.get(c.species)||0) + extra);
  });
  return map;
}
function extrasLetterOf(name){
  const m = String(name||'').match(/[A-Za-z]/);
  return m ? m[0].toUpperCase() : '#';
}
/* Strict alphabetical layout: one pocket per extra COPY (so 3 extra copies of
   a species means 3 separate pockets, each individually trackable), grouped
   under a letter-header pocket, with a fresh page starting the moment the
   first letter changes — never mid-page. */
function computeExtrasLayout(list, extraMap){
  const rows = [];
  let pocket = 0, page = 1, lastLetter = null;
  function place(row){
    pocket++;
    if(pocket>9){ pocket=1; page++; }
    row.page=page; row.pocket=pocket;
    rows.push(row);
  }
  function forceNewPage(){
    if(pocket!==0){ pocket=0; page++; }
  }
  for(const s of list){
    const letter = extrasLetterOf(s.name);
    if(letter !== lastLetter){
      forceNewPage();
      place({type:'label', display:letter});
      lastLetter = letter;
    }
    const copies = extraMap.get(s.name) || 0;
    for(let i=1;i<=copies;i++){
      place({type:'POKÉMON', species:s, copyIndex:i, copyTotal:copies});
    }
  }
  return rows;
}

let extrasFilter = { q:'' };
let extrasPage = 1;
function renderExtras(){
  const extraMap = extrasBySpecies();
  let list = SPECIES.filter(s => extraMap.has(s.name));
  if(extrasFilter.q){
    const q = norm(extrasFilter.q);
    list = list.filter(s => norm(s.name).includes(q));
  }
  list = list.slice().sort((a,b)=>a.name.localeCompare(b.name));

  const rows = computeExtrasLayout(list, extraMap);
  const totalPages = rows.length ? rows[rows.length-1].page : 1;
  extrasPage = Math.max(1, Math.min(totalPages, extrasPage||1));
  const pageCells = rows.filter(r=>r.page===extrasPage).sort((a,b)=>a.pocket-b.pocket);
  while(pageCells.length < 9) pageCells.push(null);

  const totalExtraCopies = Array.from(extraMap.values()).reduce((a,b)=>a+b,0);

  return `
    <div class="pagehead">
      <div><h1>Extras Binder</h1><div class="sub">${fmtInt(totalExtraCopies)} extra cards across ${fmtInt(list.length)} species · alphabetical, one slot per copy · duplicates &amp; copies not used as your main binder pick</div></div>
    </div>
    <div class="toolbar">
      <div class="searchbar">${ICONS.search}<input type="search" id="extrasSearch" placeholder="Filter extras by Pokémon name…" value="${esc(extrasFilter.q)}"></div>
    </div>
    ${list.length===0 ? `<div class="emptystate card">${ICONS.empty}<h3>No extras yet</h3><p>Copies you own beyond your binder pick — or cards for a species that isn't your pick — show up here automatically.</p></div>` : `
    <div class="binder-toolbar">
      <button class="btn" id="extrasPrev" ${extrasPage<=1?'disabled':''}>${ICONS.left} Prev</button>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="binder-pagelabel">Page ${extrasPage} of ${totalPages}</span>
        <div class="pager"><input type="number" id="extrasJump" min="1" max="${totalPages}" value="${extrasPage}"><button class="btn sm" id="extrasGo">Go</button></div>
      </div>
      <button class="btn" id="extrasNext" ${extrasPage>=totalPages?'disabled':''}>Next ${ICONS.right}</button>
    </div>
    <div class="binder-page"><div class="binder-grid">${pageCells.map(c=>renderExtraPocket(c)).join('')}</div></div>
    `}
  `;
}

function statusLabel(s){
  return { new:'New', update:'Update', duplicate:'Unchanged', review:'Needs review' }[s] || s;
}

function handleImportFile(file){
  const name = file.name.toLowerCase();
  const reader = new FileReader();
  reader.onerror = () => toast('Could not read that file.');
  if(name.endsWith('.csv')){
    reader.onload = e => {
      const arr = parseCSV(String(e.target.result));
      ingestParsedRows(file.name, arr);
    };
    reader.readAsText(file);
  } else if(name.endsWith('.xlsx') || name.endsWith('.xls')){
    reader.onload = e => {
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const arr = XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' });
        ingestParsedRows(file.name, arr);
      }catch(err){ console.error(err); toast('Could not parse that spreadsheet.'); }
    };
    reader.readAsArrayBuffer(file);
  } else {
    toast('Please choose a .csv or .xlsx file.');
  }
}
function ingestParsedRows(filename, arrOfArrays){
  if(!arrOfArrays || arrOfArrays.length < 2){ toast('That file looks empty.'); return; }
  const rows = parseCollectrFile(filename, arrOfArrays);
  const portfolios = {};
  rows.forEach(r => { const p = r.portfolio || '(none)'; portfolios[p] = (portfolios[p]||0)+1; });
  let defaultPortfolio = Object.keys(portfolios).find(p => /kyle/i.test(p)) || Object.keys(portfolios)[0] || '';
  importState = { filename, rawRows: rows, portfolios, portfolio: defaultPortfolio, preview:null, manual:{} };
  render();
}

function buildAndShowPreview(){
  importState.preview = buildImportPreview(importState.rawRows, importState.portfolio);
  render();
}

function doCommitImport(){
  const items = importState.preview.items;
  $$('.review-species-select').forEach(sel => {
    const idx = parseInt(sel.dataset.reviewIdx,10);
    if(sel.value) items[idx].manualSpecies = sel.value;
  });
  $$('.review-skip').forEach(cb => {
    const idx = parseInt(cb.dataset.reviewIdx,10);
    if(cb.checked) items[idx].acceptUnlinked = true;
  });
  const stillUnresolved = items.filter(i => i.status==='review' && !i.manualSpecies && !i.acceptUnlinked);
  if(stillUnresolved.length){
    confirmAction(`${stillUnresolved.length} card(s) still need a species chosen or "keep unlinked" checked. Skip them for now and import the rest?`, () => {
      finishCommit();
    });
    return;
  }
  finishCommit();
}
function finishCommit(){
  const batch = commitImport(importState.preview, importState.filename, importState.portfolio);
  toast(`Import complete — ${batch.added} new, ${batch.updated} updated.`);
  resetImportState();
  location.hash = '#/history';
}

/* ============================================================
   Cloud sync — optional, free (Firebase Firestore). Nothing here
   runs unless the person pastes in their own Firebase config and
   turns it on; the app is fully local/offline by default.
   ============================================================ */
let firebaseApp = null, firestoreDb = null, unsubscribeSnapshot = null;
let cloudSyncBusy = false, cloudPushTimer = null;

function cloudDocRef(){
  if(!firestoreDb || !STATE.settings.cloudSync || !STATE.settings.cloudSync.syncCode) return null;
  const code = norm(STATE.settings.cloudSync.syncCode).replace(/\s+/g,'-');
  return firestoreDb.collection('kylesDeckSync').doc(code);
}
function loadFirebaseSdk(){
  if(window.firebase && window.firebase.firestore) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s1 = document.createElement('script');
    s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
    s1.onload = () => {
      const s2 = document.createElement('script');
      s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js';
      s2.onload = () => resolve();
      s2.onerror = () => reject(new Error('could not load the cloud sync library — check your connection'));
      document.head.appendChild(s2);
    };
    s1.onerror = () => reject(new Error('could not load the cloud sync library — check your connection'));
    document.head.appendChild(s1);
  });
}
async function connectCloudSync(configText, syncCode){
  let config;
  try{ config = JSON.parse(configText); }
  catch(e){ toast('That doesn\'t look like valid Firebase config JSON — paste the whole { … } object.'); return false; }
  if(!syncCode || !syncCode.trim()){ toast('Enter a sync code first — any private word or phrase works, as long as every device uses the same one.'); return false; }
  try{
    await loadFirebaseSdk();
    firebaseApp = (window.firebase.apps && window.firebase.apps.length) ? window.firebase.app() : window.firebase.initializeApp(config);
    firestoreDb = window.firebase.firestore();
  }catch(e){
    toast('Could not connect: ' + e.message);
    return false;
  }
  STATE.settings.cloudSync = { enabled:true, syncCode: syncCode.trim(), config, lastPushedAt: STATE.settings.cloudSync?.lastPushedAt || 0 };
  persist('settings');
  try{
    await pullThenWatch();
  }catch(e){
    toast('Connected, but the first sync failed — will keep retrying: ' + e.message);
  }
  toast('Cloud sync connected.');
  return true;
}
async function pullThenWatch(){
  const ref = cloudDocRef();
  if(!ref) return;
  try{
    const snap = await ref.get();
    if(snap.exists){
      const remote = snap.data();
      if((remote.updatedAt||0) > (STATE.settings.cloudSync.lastPushedAt||0)) applyRemoteState(remote);
    } else {
      await pushToCloud();
    }
  }catch(e){
    toast('Cloud sync: could not reach the server — will keep trying in the background.');
  }
  watchCloud();
}
function applyRemoteState(remote){
  STATE.collection = remote.collection || [];
  STATE.picks = remote.picks || {};
  STATE.history = remote.history || [];
  STATE.overrides = remote.overrides || {};
  const keepCloudSync = STATE.settings.cloudSync;
  STATE.settings = Object.assign({ currency:'USD' }, remote.settings||{});
  STATE.settings.cloudSync = keepCloudSync;
  STATE.settings.cloudSync.lastPushedAt = remote.updatedAt || Date.now();
  Object.keys(LS_KEYS).forEach(k => persist(k));
  toast('Synced the latest data from the cloud.');
  render();
}
function watchCloud(){
  const ref = cloudDocRef();
  if(!ref) return;
  if(unsubscribeSnapshot) unsubscribeSnapshot();
  unsubscribeSnapshot = ref.onSnapshot(snap => {
    if(!snap.exists) return;
    const remote = snap.data();
    if((remote.updatedAt||0) > (STATE.settings.cloudSync.lastPushedAt||0) && !cloudSyncBusy) applyRemoteState(remote);
  }, err => console.error('cloud watch error', err));
}
function scheduleCloudPush(){
  if(!STATE.settings.cloudSync || !STATE.settings.cloudSync.enabled) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushToCloud, 1200);
}
async function pushToCloud(){
  const ref = cloudDocRef();
  if(!ref) return;
  cloudSyncBusy = true;
  const now = Date.now();
  const payload = {
    collection: STATE.collection, picks: STATE.picks, history: STATE.history, overrides: STATE.overrides,
    settings: { currency: STATE.settings.currency }, updatedAt: now,
  };
  try{
    await ref.set(payload);
    STATE.settings.cloudSync.lastPushedAt = now;
    persist('settings');
  }catch(e){
    console.error('cloud push failed', e);
  }
  cloudSyncBusy = false;
}
function disconnectCloudSync(){
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
  STATE.settings.cloudSync = { enabled:false, syncCode:'', config:null };
  persist('settings');
  toast('Cloud sync turned off. Your data stays right here on this device.');
  render();
}
function showCloudSyncHelp(){
  openModal('Getting a free Firebase config', `
    <ol style="padding-left:18px;line-height:1.8;font-size:13.5px;">
      <li>Go to <strong>console.firebase.google.com</strong> and sign in with any Google account.</li>
      <li>Click <strong>Add project</strong>, give it any name (e.g. "kyles-deck"), and finish the wizard — you can turn off Google Analytics.</li>
      <li>On the project overview page, click the <strong>&lt;/&gt;</strong> (web) icon to register a new web app. Any nickname is fine.</li>
      <li>Firebase shows a <code>firebaseConfig</code> object. Copy the whole <code>{ … }</code> and paste it into the box here.</li>
      <li>In the left sidebar go to <strong>Build → Firestore Database → Create database</strong>. Start in <strong>test mode</strong> and pick any region.</li>
      <li>That's it for setup — every device just needs this same config plus the same sync code, entered once here in Settings.</li>
    </ol>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:12px;">
      Test mode opens the database for 30 days. For something that keeps working after that, open the <strong>Rules</strong> tab
      in Firestore and replace them with this — it only allows access to a document whose name is your exact sync code,
      so nobody can browse anyone else's data without knowing it (this is convenience, not bank-grade security — treat
      your sync code like a shared password):
    </p>
    <pre style="background:var(--paper-sunken);padding:10px;border-radius:6px;font-size:11.5px;overflow-x:auto;white-space:pre-wrap;">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /kylesDeckSync/{syncCode} {
      allow read, write: if true;
    }
  }
}</pre>
  `, `<button class="btn primary" data-action="close-modal">Got it</button>`);
}
// Reconnect automatically on load if cloud sync was already turned on.
if(STATE.settings.cloudSync && STATE.settings.cloudSync.enabled && STATE.settings.cloudSync.config){
  connectCloudSync(JSON.stringify(STATE.settings.cloudSync.config), STATE.settings.cloudSync.syncCode).catch(()=>{});
}

/* ============================================================
   Settings
   ============================================================ */
function renderSettings(){
  const cs = STATE.settings.cloudSync || { enabled:false, syncCode:'', config:null };
  return `
    <div class="pagehead"><div><h1>Settings</h1></div></div>
    <div class="panel" style="margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">Backup &amp; export</div>
      <p style="color:var(--ink-soft);font-size:13px;">Your collection, binder picks, and import history all live in this browser${cs.enabled ? ', and are synced to your cloud sync code' : ''}. Back them up regularly, especially before clearing browser data.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn primary" id="exportBackupBtn">Download full backup (.json)</button>
        <button class="btn" id="exportCsvBtn">Export collection (.csv)</button>
      </div>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">Restore backup</div>
      <p style="color:var(--ink-soft);font-size:13px;">Restoring replaces everything currently in this app with the contents of the backup file.</p>
      <button class="btn" id="restoreBackupBtn">Choose backup file…</button>
      <input type="file" id="restoreInput" accept=".json" class="hidden">
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">Cloud sync <span style="font-weight:400;color:var(--ink-soft);font-size:12px;">(optional)</span></div>
      <p style="color:var(--ink-soft);font-size:13px;">Keep this collection in sync across your devices — put the same sync code + config on each one. Runs on a free Firebase project (about 5 minutes to set up once; free tier is enormous for a collection this size, so storage isn't something to worry about even with photos in the mix, since artwork is pulled live from the web rather than stored).</p>
      <div style="display:flex;align-items:center;gap:8px;margin:12px 0;font-size:13px;">
        ${cs.enabled
          ? `<span class="dot owned"></span> Connected — syncing as <strong>${esc(cs.syncCode)}</strong>`
          : `<span class="dot" style="background:var(--line-strong);"></span> Not connected — this device only`}
      </div>
      ${!cs.enabled ? `
      <div class="field"><label>Sync code — keep this private, it's shared like a password</label>
        <input type="text" id="csCode" placeholder="e.g. kyle-scottie-binder-2026" value="${esc(cs.syncCode||'')}"></div>
      <div class="field"><label>Firebase web app config — paste the whole object from your Firebase console</label>
        <textarea id="csConfig" rows="5" placeholder='{"apiKey":"…","projectId":"…", …}'></textarea></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn primary" id="csConnectBtn">${ICONS.cloud} Connect cloud sync</button>
        <button class="btn ghost" id="csHelpBtn">How do I get a Firebase config?</button>
      </div>` : `
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn" id="csPushBtn">Push this device's data to the cloud</button>
        <button class="btn" id="csPullBtn">Pull latest from the cloud</button>
        <button class="btn accent" id="csDisconnectBtn">${ICONS.cloudOff} Turn off cloud sync</button>
      </div>`}
    </div>
    ${renderCategoryManager()}
    <div class="panel">
      <div class="section-title" style="margin-top:0;">Reset</div>
      <p style="color:var(--ink-soft);font-size:13px;">Permanently erase all cards, binder picks, and import history from this browser${cs.enabled ? ' and from the cloud sync code above' : ''}.</p>
      <button class="btn accent" id="resetAllBtn">${ICONS.trash} Erase all data</button>
    </div>
  `;
}
function downloadFile(filename, content, type){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function exportBackup(){
  const data = { exportedAt: new Date().toISOString(), version:1, ...STATE };
  downloadFile(`kyles-deck-backup-${todayISO()}.json`, JSON.stringify(data,null,2), 'application/json');
}
function exportCollectionCSV(){
  const headers = ['Species','Set','Card Number','Rarity','Variance','Grade','Condition','Cost Paid','Market Price','Quantity','Date Added','Binder Pick','Notes'];
  const lines = [headers.join(',')];
  STATE.collection.forEach(c => {
    const isPick = c.species && STATE.picks[c.species]===c.id;
    const row = [c.species||c.productName, c.set, c.cardNumber, c.rarity, c.variance, c.grade, c.condition, c.costPaid, c.marketPrice, c.quantity, c.dateAdded, isPick?'Yes':'No', c.notes]
      .map(v => `"${String(v==null?'':v).replace(/"/g,'""')}"`);
    lines.push(row.join(','));
  });
  downloadFile(`kyles-deck-collection-${todayISO()}.csv`, lines.join('\n'), 'text/csv');
}
function restoreBackup(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      confirmAction('Replace all current data with this backup?', () => {
        STATE = {
          collection: data.collection||[], picks: data.picks||{}, history: data.history||[],
          overrides: data.overrides||{}, settings: data.settings||{currency:'USD'},
          labelOverrides: data.labelOverrides||{}, mergedLabels: data.mergedLabels||{},
          categoryOverrides: data.categoryOverrides||{},
          manualOwned: data.manualOwned||{},
          taxonomy: data.taxonomy || { groups: JSON.parse(JSON.stringify(DEFAULT_GROUP_ORDER)), categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORY_ORDER)), subcategories: JSON.parse(JSON.stringify(DEFAULT_SUBCATEGORY_ORDER)) },
          familyOverrides: data.familyOverrides||{},
        };
        GROUP_ORDER = STATE.taxonomy.groups;
        CATEGORY_ORDER = STATE.taxonomy.categories;
        SUBCATEGORY_ORDER = STATE.taxonomy.subcategories;
        Object.keys(LS_KEYS).forEach(k => persist(k));
        Object.keys(STATE.categoryOverrides).forEach(nm => {
          const sp = SPECIES.find(s => s.name === nm);
          const ov = STATE.categoryOverrides[nm];
          if(sp && ov) Object.assign(sp, ov);
        });
        Object.keys(STATE.familyOverrides).forEach(nm => {
          const sp = SPECIES.find(s => s.name === nm);
          const ov = STATE.familyOverrides[nm];
          if(sp && ov) Object.assign(sp, ov);
        });
        rebuildBinder();
        toast('Backup restored.');
        location.hash = '#/dashboard'; render();
      });
    }catch(err){ toast('That file could not be read as a backup.'); }
  };
  reader.readAsText(file);
}
